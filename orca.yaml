# Orca worktree hooks — run in each fresh Orca-managed worktree.
#
# GUARDRAIL: on the hn-agent runtime this repo's worktrees live in the same home
# as the LIVE Hermes gateway, and Orca launches agents with
# --dangerously-skip-permissions. A lane must never read or write ~/.hermes/
# (config.yaml, .env, .env.refs, SOUL.md), and must never start, stop, or
# restart hermes-gateway.service or hermes-dashboard.service. Work the checkout
# only; deployment is a separate, human-run step.
#
# Docs: hn-infra/scripts/orca/README.md
scripts:
  setup: |
    export PATH="$HOME/.local/bin:$HOME/node22/bin:$PATH"
    cd "${ORCA_WORKTREE_PATH:-$PWD}"
    # messaging extra brings aiohttp (gateway tests); dev group brings pytest.
    uv sync --frozen --extra messaging --group dev || echo "orca-setup: uv sync --frozen failed — run it manually before testing"
    # v0.23 moved the JS side to a pnpm workspace (no root package-lock.json any more).
    pnpm install --frozen-lockfile || echo "orca-setup: pnpm install --frozen-lockfile failed — run it manually before building the desktop/dashboard"
issueCommand: |
  Work the GitHub issue at {{artifact_url}}. Read the issue and its comments
  first, follow this repo's AGENTS.md conventions, and open a PR when done.
  Never touch ~/.hermes/ or the hermes-gateway/hermes-dashboard services.
